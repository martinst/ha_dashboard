name: Home Dashboard
version: "1.8.1"
slug: ac_dashboard
description: Simple web pages for AC units, motorized windows, doors (Google sign-in) and outdoor/indoor temperature
url: https://github.com/martinst/ha_dashboard
arch:
  - aarch64
  - armv7
  - amd64
init: false
homeassistant_api: true
startup: services
boot: auto
map:
  - ssl:ro
ports:
  8088/tcp: 8088
ports_description:
  8088/tcp: Dashboard web UI
webui: "[PROTO:ssl]://[HOST]:[PORT:8088]"
options:
  groups: []
  presets: []
  window_groups: []
  window_presets: []
  outdoor_sensor: ""
  indoor_sensor: ""
  door_groups: []
  google_client_id: ""
  google_client_secret: ""
  allowed_emails: []
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  groups:
    - name: str
      entities:
        - str
  presets:
    - name: str
      entities:
        - str
      mode: str?
      temperature: float?
      time: str
  window_groups:
    - name: str
      entities:
        - str
  window_presets:
    - name: str
      entities:
        - str
      action: str?
      position: int?
      time: str
  outdoor_sensor: str?
  indoor_sensor: str?
  door_groups:
    - name: str
      entities:
        - str
  google_client_id: str?
  google_client_secret: password?
  allowed_emails:
    - str
  ssl: bool
  certfile: str?
  keyfile: str?
