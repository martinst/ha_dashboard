name: Home Dashboard
version: "1.4.0"
slug: ac_dashboard
description: Simple web pages for controlling AC units and motorized windows — no HA login needed
url: https://github.com/martinst/ha_dashboard
arch:
  - aarch64
  - armv7
  - amd64
init: false
homeassistant_api: true
startup: services
boot: auto
map:
  - ssl:ro
ports:
  8088/tcp: 8088
ports_description:
  8088/tcp: Dashboard web UI
webui: "[PROTO:ssl]://[HOST]:[PORT:8088]"
options:
  groups: []
  presets: []
  window_groups: []
  window_presets: []
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  groups:
    - name: str
      entities:
        - str
  presets:
    - name: str
      entities:
        - str
      mode: str?
      temperature: float?
      time: str
  window_groups:
    - name: str
      entities:
        - str
  window_presets:
    - name: str
      entities:
        - str
      action: str?
      position: int?
      time: str
  ssl: bool
  certfile: str?
  keyfile: str?
