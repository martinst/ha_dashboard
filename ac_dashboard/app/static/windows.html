<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2e86de">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Home Dashboard — Windows</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css?v=1.10.0">
</head>
<body>
  <header>
    <nav class="pages">
      <a href="/" class="page-link">AC</a>
      <a href="/windows.html" class="page-link active">Windows</a>
      <a href="/doors.html" class="page-link">Doors</a>
    </nav>
    <span id="status-dot" class="dot" title="Connection to Home Assistant"></span>
  </header>
  <section id="temps" class="temps hidden"></section>
  <nav class="tabs">
    <button id="tab-control" class="tab active">Control</button>
    <button id="tab-schedule" class="tab">Schedule</button>
  </nav>
  <div id="banner" class="banner hidden">Can't reach Home Assistant</div>
  <main id="groups"></main>
  <main id="schedule" class="hidden"></main>
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button id="sheet-close" class="sheet-close" aria-label="Close">✕</button>
      </div>
      <div id="sheet-ranges" class="range-toggle"></div>
      <div id="sheet-summary" class="chart-summary"></div>
      <div id="sheet-chart" class="chart"></div>
    </div>
  </div>
  <script src="/shared.js?v=1.10.0"></script>
  <script src="/windows.js?v=1.10.0"></script>
</body>
</html>
